<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page 4</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9966,#ff5e62);
    overflow:hidden;
}

/* Main Card */
.card{
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:white;
    animation:fadeIn 1.2s ease;
}

img{
    width:90%;
    max-width:300px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 20px 40px rgba(0,0,0,0.4);
}

button{
    padding:12px 35px;
    border:none;
    border-radius:30px;
    font-size:16px;
    cursor:pointer;
    background:black;
    color:white;
    transition:0.3s;
}

button:hover{
    transform:scale(1.1);
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

/* Popup */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.7);
    display:flex;
    justify-content:center;
    align-items:center;
    visibility:hidden;
    opacity:0;
    transition:0.4s;
}

.popup img{
    width:90%;
    max-width:400px;
    border-radius:20px;
    animation:zoomIn 0.6s ease;
}

.popup.active{
    visibility:visible;
    opacity:1;
}

@keyframes fadeIn{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}

@keyframes zoomIn{
    from{transform:scale(0.5);}
    to{transform:scale(1);}
}
</style>
</head>

<body>

<div class="card">
    <img src="images/image4.jpg" alt="">
    <h2>this is my web page</h2>
    <button onclick="showPopup()">ACCEPT</button>
</div>

<!-- Popup -->
<div class="popup" id="popup">
    <img src="images/background.jpg" alt="Popup Image">
</div>

<!-- Background Audio -->
<audio id="bgMusic" loop>
    <source src="audio/music.mp3" type="audio/mp3">
</audio>

<script>
function showPopup(){
    const popup = document.getElementById("popup");
    const audio = document.getElementById("bgMusic");

    // Show popup
    popup.classList.add("active");

    // Play music
    audio.volume = 1.0;   // maximum allowed
    audio.loop = true;
    audio.play().catch(err => {
        console.log("Autoplay blocked:", err);
    });
}
</script>

</body>
</html>
